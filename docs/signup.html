<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Build SJ</title>
  <link rel="icon" type="image/webp" href="logo.webp">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <div class="bg" aria-hidden="true">
    <img class="bg-media" src="forest.jpg" alt="" />
    <div class="bg-overlay"></div>
  </div>

  <header class="site-nav" id="top">
    <a class="logo" href="home.html">Build SJ</a>
    <nav class="auth-nav" aria-label="Account">
      <a href="login.html" data-auth-link>Log In</a>
      <a href="signup.html" data-auth-link aria-current="page">Sign Up</a>
    </nav>
    <a class="back-home" href="home.html">&larr; Home</a>
  </header>

  <p class="eyebrow">Build SJ / Wildfire preparedness</p>

  <h1>Sign Up</h1>

  <p class="intro">
    Create an account to build your emergency disaster kit and prepare your
    household for a wildfire evacuation.
  </p>

  <div id="auth-form">
    <form id="email-form" data-auth-action="signup">
      <input type="email" id="email" placeholder="Email" autocomplete="email" required />

      <input
        type="password"
        id="password"
        placeholder="Password (8+ characters)"
        autocomplete="new-password"
        required
      />

      <button type="submit">Create Account</button>
    </form>

    <p class="divider">or</p>

    <button type="button" id="google-btn" class="oauth-btn">
      <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt=""
        class="google-icon"
      />
      <span>Continue with Google</span>
    </button>

    <p id="message"></p>
  </div>

  <footer class="site-footer">
    <span>Emergency preparedness</span>
    <span>San Jose, California</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
</body>
</html>
