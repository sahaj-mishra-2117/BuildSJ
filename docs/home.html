<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build SJ | Emergency Preparedness</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;

            background:
                linear-gradient(
                    rgba(0, 25, 10, 0.35),
                    rgba(0, 25, 10, 0.55)
                ),
                url("https://images.unsplash.com/photo-1448375240586-882707db888b?w=2000");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        header {
            background: rgba(18, 55, 30, 0.95);
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            border: 1px solid white;
            border-radius: 8px;
            padding: 10px 18px;
            transition: background 0.2s;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        main {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .hero {
            max-width: 800px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(36px, 6vw, 64px);
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .button {
            display: inline-block;
            padding: 15px 28px;
            background: #315f3b;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            border: 1px solid white;
            transition: 0.2s;
        }

        .button:hover {
            background: #1e4229;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(18, 55, 30, 0.9);
        }

        @media (max-width: 600px) {
            header {
                justify-content: center;
                text-align: center;
            }

            nav {
                justify-content: center;
            }

            .hero p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="home.html" class="logo">Build SJ</a>

        <nav>
            <a href="home.html">Home</a>
            <a href="index.html">Emergency Map</a>
            <a href="checklist.html">Preparation Checklist</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Be Prepared. Stay Safe.</h1>

            <p>
                Helping San Jose residents prepare for
                emergencies, protect their families,
                and build a safer community.
            </p>

            <div class="buttons">
                <a href="checklist.html" class="button">
                    Get Prepared
                </a>

                <a href="index.html" class="button">
                    View Emergency Map
                </a>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2026 Build SJ.
        Building a Safer San Jose.
    </footer>

</body>
</html>
