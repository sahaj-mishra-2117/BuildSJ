<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Map | Build SJ</title>
    <meta name="description" content="Interactive wildfire hazard severity map for San Jose District 10.">
    <link rel="icon" type="image/webp" href="logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="website.css">
</head>
<body class="map-page">
    <!-- Shared header. The body class above highlights the active tab. -->
    
<!-- BUILD SJ NAVIGATION HEADER -->

<header class="site-header">
    <nav class="site-nav">

        <a href="home.html" class="brand">
            Build SJ
        </a>

        <div class="nav-links">

            <a href="home.html"
               class="nav-link nav-home">
                Home
            </a>

            <a href="index.html"
               class="nav-link nav-map">
                Emergency Map
            </a>

            <a href="checklist.html"
               class="nav-link nav-checklist">
                Preparation Checklist
            </a>

            
            <a href="information.html"
               class="nav-link nav-information">
                Evacuation Information
            </a>
        </div>

        <div class="auth-actions">
            <a href="login.html" id="login-btn" class="nav-link" hidden>
                Log In
            </a>

            <a href="signup.html" id="signup-btn" class="nav-link" hidden>
                Sign Up
            </a>

            <button id="account-btn"
        class="account-button"
        hidden
        onclick="openPopup()">
    Account
</button>
        </div>

        <div id="popup" class="popup">
            <div class="popup-content">
                <h2>Account Settings</h2>
                <button id = "logout-btn">Log Out</button>
                <button onclick="closePopup()">Close</button>
            </div>
        </div>

    </nav>
</header>

    <!-- The map generated by map.py is embedded here -->
    <iframe class="map-frame" src="map.html" title="Wildfire hazard map for San Jose District 10"></iframe>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="nav-auth.js"></script>
