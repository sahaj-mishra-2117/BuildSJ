
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In | Build SJ</title>
  <link rel="icon" type="image/webp" href="logo.webp">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>

<body>

  <!-- Background image + overlay -->
  <div class="bg" aria-hidden="true">
    <img class="bg-media" src="forest.jpg" alt="" />
    <div class="bg-overlay"></div>
  </div>

  <!-- Top navigation -->
  <header class="site-nav" id="top">
    <a class="logo" href="home.html">Build SJ</a>
    <nav class="auth-nav" aria-label="Account">
      <a href="login.html" data-auth-link aria-current="page">Log In</a>
      <a href="signup.html" data-auth-link>Sign Up</a>
    </nav>
    <a class="back-home" href="home.html">&larr; Home</a>
  </header>

  <!-- Login hero -->
  <p class="eyebrow">Build SJ / Wildfire preparedness</p>

  <h1>Log In</h1>

  <p class="intro">
    Prepare for the unexpected. Build your emergency disaster kit and make
    sure your household has the essentials needed during a wildfire evacuation.
  </p>

  <!-- Login form -->
  <div id="auth-form">

    <form id="email-form" data-auth-action="login">
      <input type="email" id="email" placeholder="Email" autocomplete="email" required />

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      />

      <button type="submit">Log In</button>
    </form>

    <p class="divider">or</p>

    <!-- Google login button with logo -->
    <button type="button" id="google-btn" class="oauth-btn">
      <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt=""
        class="google-icon"
      />
      <span>Continue with Google</span>
    </button>

    <p id="message"></p>

  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <span>Emergency preparedness</span>
    <span>San Jose, California</span>
  </footer>

  <!-- Authentication scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>

</body>
</html>
