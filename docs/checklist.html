
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Preparation Checklist | Build SJ</title>

    <meta name="description"
          content="Wildfire emergency preparation checklist for San Jose District 10 residents.">

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">

    <!-- Website Styles -->
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="checklist.css">

    <!-- Checklist Progress Script -->
    <script src="script.js" defer></script>
</head>

<body class="checklist-page">

    <!-- =====================================
         BUILD SJ NAVIGATION HEADER
         ===================================== -->

    <header class="site-header">

        <nav class="site-nav">

            <a href="home.html" class="brand">
                Build SJ
            </a>

            <div class="nav-links">

                <a href="home.html"
                   class="nav-link nav-home">
                    Home
                </a>

                <a href="index.html"
                   class="nav-link nav-map">
                    Emergency Map
                </a>

                <a href="checklist.html"
                   class="nav-link nav-checklist"
                   aria-current="page">
                    Preparation Checklist
                </a>

                <a href="information.html"
                   class="nav-link nav-information">
                    Evacuation Information
                </a>

            </div>

        </nav>

    </header>


    <!-- =====================================
         MAIN CHECKLIST CONTENT
         ===================================== -->

    <main class="checklist-main">

        <!-- PROGRESS PANEL -->

        <section class="panel progress-panel">

            <p class="eyebrow">
                Wildfire Preparedness
            </p>

            <h1>Evacuation Checklist</h1>

            <p class="lead">
                Use the checklist below to prepare
                your emergency disaster kit.
                Check off each item as you gather
                your supplies and track your progress.
            </p>

            <div class="progress-row">

                <progress
                    value="0"
                    max="100"
                    id="progress-bar">
                </progress>

                <span
                    id="progress-text"
                    class="progress-text">
                    0%
                </span>

            </div>

        </section>


        <!-- =====================================
             DISASTER KIT ESSENTIALS
             ===================================== -->

        <section class="panel checklist-section">

            <h2>Disaster Kit Essentials</h2>

            <ul class="checklist">

                <!-- ITEM 1 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item1"
                        name="checked"
                        value="true">

                    <label for="check_item1">
                        Have a backpack or duffel bag
                        to store supplies
                    </label>

                </li>


                <!-- ITEM 2 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item2"
                        name="checked"
                        value="true">

                    <label for="check_item2">
                        One gallon of water per person
                    </label>

                </li>


                <!-- ITEM 3 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item3"
                        name="checked"
                        value="true">

                    <label for="check_item3">
                        3 day supply of non-perishable
                        snacks or canned food
                    </label>

                </li>


                <!-- ITEM 4 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item4"
                        name="checked"
                        value="true">

                    <label for="check_item4">
                        First-aid kit that can treat
                        minor injuries
                    </label>

                </li>


                <!-- ITEM 5 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item5"
                        name="checked"
                        value="true">

                    <label for="check_item5">
                        Hand sanitizer
                    </label>

                </li>


                <!-- ITEM 6 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item6"
                        name="checked"
                        value="true">

                    <label for="check_item6">
                        Changes of clothes
                    </label>

                </li>


                <!-- ITEM 7 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item7"
                        name="checked"
                        value="true">

                    <label for="check_item7">
                        Toothbrush and toothpaste
                    </label>

                </li>


                <!-- ITEM 8 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item8"
                        name="checked"
                        value="true">

                    <label for="check_item8">
                        Flashlight
                    </label>

                </li>


                <!-- ITEM 9 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item9"
                        name="checked"
                        value="true">

                    <label for="check_item9">
                        Battery-powered radio
                    </label>

                </li>


                <!-- ITEM 10 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item10"
                        name="checked"
                        value="true">

                    <label for="check_item10">
                        Cash and credit cards
                    </label>

                </li>


                <!-- ITEM 11 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item11"
                        name="checked"
                        value="true">

                    <label for="check_item11">
                        Whistle
                    </label>

                </li>


                <!-- ITEM 12 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item12"
                        name="checked"
                        value="true">

                    <label for="check_item12">
                        Masks
                    </label>

                </li>


                <!-- ITEM 13 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item13"
                        name="checked"
                        value="true">

                    <label for="check_item13">
                        Important documents
                        (i.e. passports and
                        birth certificates)
                    </label>

                </li>


                <!-- ITEM 14 -->

                <li class="checklist-item">

                    <input
                        type="checkbox"
                        class="task-item"
                        id="check_item14"
                        name="checked"
                        value="true">

                    <label for="check_item14">
                        Cell phone battery pack
                        with charging cords
                    </label>

                </li>

            </ul>

        </section>

    </main>

</body>
</html>
