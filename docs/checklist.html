<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Build SJ Checklist</title>
        <link rel="stylesheet" href="checklist.css">
        <script src="script.js" defer></script>
    </head>
    <body class="checklist-page" id="checklist-page">
        <header>
            <nav class="nav-links">
                <h1>Build SJ</h1>
                <div class="nav-links">
                    <a href ="index.html" class="tab-map">
                        <button class="tab-button">Map</button>
                    </a>
                    <a href="checklist.html" class="tab-checklist">
                        <button class="tab-button">Preparation Checklist</button>
                    </a>
                </div>
            </nav>
        </header>
        <div class="content">
        <h2>Wildfire Emergency: Evacuation Checklist</h2>
        <progress value="0" max="100" id="progress-bar"></progress>
        <span id="progress-text">0%</span>
        <form action="/api/save-info" method="post">
        <h2>Disaster Kit Essentials</h2>
            <ol>
            <li> 
                <input type="checkbox" class="task-item" id="check_item1" name="checked" value="true">
                <label for="check_item1">Have a backpack or duffel bag to store supplies</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item2" name="checked" value="true">
                <label for="check_item2">One gallon of water per person</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item3" name="checked" value="true">
                <label for="check_item3">3 day supply of non-perishable snacks or canned food</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item4" name="checked" value="true">
                <label for="check_item4">First-aid kit that can treat minor injuries</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item5" name="checked" value="true">
                <label for="check_item5">Hand Sanitizer</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item6" name="checked" value="true">
                <label for="check_item6">Changes of Clothes.</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item7" name="checked" value="true">
                <label for="check_item7">Toothbrush and toothpaste</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item8" name="checked" value="true">
                <label for="check_item8">Flashlight.</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item9" name="checked" value="true">
                <label for="check_item9">Battery-Powered Radio</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item10" name="checked" value="true">
                <label for="check_item10">Cash and Credit Cards</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item11" name="checked" value="true">
                <label for="check_item11">Whistle</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item12" name="checked" value="true">
                <label for="check_item12">Masks</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item13" name="checked" value="true">
                <label for="check_item13">Important documents (i.e. Passports and birth certificates)</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item14" name="checked" value="true">
                <label for="check_item14">Cell phone battery pack with charging cords</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item15" name="checked" value="true">
                <label for="check_item15"><a href="https://shorturl.at/bHeBZ">SJFD Disaster Kit Vid</a></label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item16" name="checked" value="true">
                <label for="check_item16"><a href="https://shorturl.at/tlIGm">Disaster Kit Vid</a></label>
               
               
            </li>
        </ol>
        <h2>Inside your home</h2>
        <ol>
             <li>
                <input type="checkbox" class="task-item" id="check_item17" name="checked" value="true">
                <label for="check_item17">Prepare an emergency supply kit and wildfire evacuation plan.</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item18" name="checked" value="true">
                <label for="check_item18">Know your community’s emergency plan, evacuation destinations, and escape routes.</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item19" name="checked" value="true">
                <label for="check_item19">Close windows and doors, but leave them unlocked.</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item20" name="checked" value="true">
                <label for="check_item20">Remove flammable curtains and shades, and move flammable furniture away from windows and doors.</label>
            </li>
            <li>
                <input type="checkbox" class="task-item" id="check_item21" name="checked" value="true">
                <label for="check_item21">Shut off gas and pilot lights, turn off the air conditioner, and leave lights on for firefighters.</label>
            </li>
        </ol>
        <h2>Outside your home</h2> 
        <ol>
        <li>
            <input type="checkbox" class="task-item" id="check_item22" name="checked" value="true">
            <label for="check_item22">Bring flammable outdoor items inside and move propane grills away from buildings.</label>
        </li> 
        <li>
            <input type="checkbox" class="task-item" id="check_item23" name="checked" value="true">
            <label for="check_item23">Turn off propane tanks and connect garden hoses for firefighters, but do not leave sprinklers or water running.</label>
        </li>
        <li>
            <input type="checkbox" class="task-item" id="check_item24" name="checked" value="true">
            <label for="check_item24">Leave exterior lights on so firefighters can see your home.</label>
        </li>
        <li>
            <input type="checkbox" class="task-item" id="check_item25" name="checked" value="true">
            <label for="check_item25">Put your emergency kit in your vehicle, back your car into the driveway, and keep your keys with you.</label>
        </li> 
        <li>
            <input type="checkbox" class="task-item" id="check_item26" name="checked" value="true">
            <label for="check_item26">Place a ladder where firefighters can access the roof.</label>
        </li>
        <li>
            <input type="checkbox" class="task-item" id="check_item27" name="checked" value="true">
            <label for="check_item27">Seal attic and ground vents to help prevent embers from entering.</label>
        </li>
        <li>
            <input type="checkbox" class="task-item" id="check_item28" name="checked" value="true">
            <label for="check_item28">Monitor the fire, evacuate if you feel threatened, and check that neighbors are preparing to leave.</label>
        </li>  
        </ol>
    
        <h2>Animals</h2>
        <ol>
        <li>
            <input type="checkbox" class="task-item" id="check_item32" name="checked" value="true">
            <label for="check_item32">Locate your pets and keep them nearby.</label>
        </li>
        <li>
            <input type="checkbox" class="task-item" id="check_item33" name="checked" value="true">
            <label for="check_item33">Prepare farm animals for transport and think about moving them to a safe location early.</label>
        </li>
        </ol>  
    <h2><a href="https://www.sanjoseca.gov/your-government/departments-offices/fire-department/public-education/wildfire-preparedness/wildfire-evacuation">Wildfire Evacuation Steps</a></h2>
    <ol>
      <li>
            <input type="checkbox" class="task-item" id="check_item29" name="checked" value="true">
            <label for="check_item29">Review the pre-evacuation checklist.</label>
        </li>
        <li>
            <input type="checkbox" class="task-item" id="check_item30" name="checked" value="true">
            <label for="check_item30">Check that your emergency supply kit is in your vehicle.</label>
        </li>
        <li>
            <input type="checkbox" class="task-item" id="check_item31" name="checked" value="true">
            <label for="check_item31">Cover-up to protect against heat and flying embers. Wear a long-sleeve shirt, long pants, heavy shoes, cap, bandanna to cover your face, and goggles or glasses. If possible, where clothes are made from cotton.</label>
        </li>  
    </ol>  
    <button type="submit" class="submit-button">Submit Information</button>
</form>
</body>
</html>
